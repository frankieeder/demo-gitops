# "Keep namespace demo-prod matching deploy/prod on the main branch. Forever."
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: demo-prod
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/frankieeder/demo-gitops.git
    targetRevision: main
    path: deploy/prod
  destination:
    server: https://kubernetes.default.svc
    namespace: demo-prod
  syncPolicy:
    automated:
      prune: true      # delete things removed from Git
      selfHeal: true   # undo changes made by hand
    syncOptions: [CreateNamespace=true]
