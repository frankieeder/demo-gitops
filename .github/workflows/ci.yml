# CI never talks to the cluster. It only builds images and (on main) commits a new tag.
# Argo, running inside the cluster, notices the commit and deploys it.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write     # to commit the new tag on main
  packages: write     # to push images to ghcr.io

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Which commit are we building?
        id: vars
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          # For PRs, use the PR's head commit: that's what Argo's preview asks for.
          sha="${{ github.event.pull_request.head.sha || github.sha }}"
          {
            echo "sha=$sha"
            echo "tag=sha-$sha"
            echo "image=ghcr.io/${OWNER,,}/demo-gitops"   # GHCR needs lowercase
          } >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.vars.outputs.sha }}

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (Intel + Apple Silicon)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.vars.outputs.image }}:${{ steps.vars.outputs.tag }}
          build-args: COMMIT=${{ steps.vars.outputs.sha }}

      - name: Deploy to prod (commit the new tag)
        if: github.event_name == 'push' && github.ref_name == 'main'
        env:
          TAG: ${{ steps.vars.outputs.tag }}
        run: |
          git fetch origin main && git checkout -B main origin/main
          yq -i '.images[0].newTag = strenv(TAG)' deploy/prod/kustomization.yaml
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -am "deploy prod: $TAG"
          git push origin main
          # Commits made with GITHUB_TOKEN don't trigger workflows, so no loop.
