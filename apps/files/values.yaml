defaultPodOptions:
  nodeSelector:
    storage/media: "true"

controllers:
  files:
    containers:
      app:
        image:
          repository: nginx
          tag: 1.27-alpine

persistence:
  media:
    type: hostPath
    hostPath: /data/media
    hostPathType: Directory
    globalMounts:
      - path: /usr/share/nginx/html
        readOnly: true

service:
  app:
    controller: files
    ports:
      http:
        port: 80

ingress:
  app:
    className: traefik
    hosts:
      - host: files.demo.localhost
        paths:
          - path: /
            service:
              identifier: app
              port: http
